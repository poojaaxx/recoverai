spring:
  application:
    name: recoverai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recoverai}
    username: ${DB_USERNAME:recoverai}
    password: ${DB_PASSWORD:recoverai}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # PORT takes priority when set (Render/Railway/Heroku-style platforms
  # inject it and expect the app to bind to it); SERVER_PORT is the
  # explicit override for anyone not using such a platform; 8080 is the
  # local-dev default.
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Never show dependency/DB details (connection strings, driver info)
      # in the health response body - only UP/DOWN. See docs/DEMO.md /
      # README "Buildathon Deployment" for the health-check contract.
      show-details: never

recoverai:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Phase 8 seed data, made explicitly opt-in for deployment (off by
  # default everywhere, including this default/production profile) so a
  # deployed instance never silently reseeds itself on every restart. Set
  # DEMO_SEED_ENABLED=true only for the buildathon demo deployment - see
  # DemoSeedRunner and README "Buildathon Deployment".
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:false}

  # Phase 5 - AI Recovery Agent. The AI only recommends; RecoveryPolicyService
  # (Phase 4) remains the sole authorization boundary. Default provider is
  # "mock" - deterministic, offline, no API key required - so the app builds,
  # runs, and tests fully without AI credentials. See docs/ARCHITECTURE.md.
  ai:
    provider: ${AI_PROVIDER:mock} # mock | anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-5}
      temperature: ${ANTHROPIC_TEMPERATURE:0.2}
      timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:15}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}

  # Phase 6 - Razorpay Integration / Payment Adapter. PaymentGateway is a
  # pure execution boundary - it never decides whether an action is safe
  # (that remains RecoveryPolicyService's job, Phase 4). Two independent
  # opt-ins (enabled=true AND mode=test) are both required before any real
  # call can be made; the default is always the offline mock. See
  # docs/ARCHITECTURE.md.
  razorpay:
    enabled: ${RAZORPAY_ENABLED:false}
    mode: ${RAZORPAY_MODE:simulation} # simulation (mock, default) | test (real Razorpay Test Mode API)
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
    timeout-seconds: ${RAZORPAY_TIMEOUT_SECONDS:15}

  # Phase 4 - Recovery Safety / Policy Engine. The AI (Phase 5) may
  # recommend a recovery action, but these deterministic thresholds decide
  # whether it is actually allowed to run. See docs/ARCHITECTURE.md.
  policy:
    max-automatic-retry-attempts: 2
    max-autonomous-recovery-amount: 25000
    max-recovery-actions-per-transaction: 3
    duplicate-action-window-hours: 24

  # Phase 3 - Revenue Risk Engine. All weights below are application-invented,
  # illustrative synthetic values for this prototype - not a statistically
  # fitted or externally validated model. See docs/ARCHITECTURE.md.
  risk:
    pending-baseline-recovery-weight: 0.60
    abandoned-baseline-recovery-weight: 0.35
    terminal-state-recovery-factor: 0.50
    failure-category-recovery-weights:
      TEMPORARY_FAILURE: 0.80
      NETWORK_ERROR: 0.75
      INSUFFICIENT_FUNDS: 0.55
      LIMIT_EXCEEDED: 0.45
      BANK_DECLINED: 0.35
      AUTHENTICATION_FAILURE: 0.30
      UNKNOWN: 0.25
    amount-thresholds:
      low: 1000
      mid: 10000
      high: 30000
    amount-factors:
      low: 0.10
      mid: 0.30
      high: 0.60
      very-high: 0.92
    weights:
      amount: 0.65
      failure: 0.18
      history: 0.05
      attempts: 0.12
    history:
      strong-threshold: 0.75
      weak-threshold: 0.35
      probability-adjustment-weight: 0.30
    attempts:
      probability-penalty-per-unit: 0.15
      risk-urgency-per-unit: 0.20
    risk-level-thresholds:
      medium: 30
      high: 60
      critical: 80

logging:
  level:
    root: INFO
    com.recoverai: DEBUG
