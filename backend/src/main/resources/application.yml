spring:
  application:
    name: recoverai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recoverai}
    username: ${DB_USERNAME:recoverai}
    password: ${DB_PASSWORD:recoverai}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

recoverai:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.recoverai: DEBUG
