spring:
  datasource:
    url: jdbc:h2:mem:recoverai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

recoverai:
  ai:
    provider: mock
  razorpay:
    mode: simulation
    webhook-secret: test_webhook_secret
  auth:
    jwt-secret: test-only-jwt-signing-secret-not-used-anywhere-else-0123456789
    jwt-expiration-minutes: 60
    demo-admin-username: test.admin
    demo-admin-password: test-admin-password
    demo-operator-username: test.operator
    demo-operator-password: test-operator-password
