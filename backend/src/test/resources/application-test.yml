spring:
  datasource:
    url: jdbc:h2:mem:recoverai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

recoverai:
  ai:
    provider: mock
  razorpay:
    mode: simulation
